name: daily

# Appends one day of MTGJSON's prices to the price history and publishes it on GitHub Pages.
# MTGJSON's build finishes around 06:15 UTC (the Last-Modified of its files), but its FAQ says the files go live at
# 9:00 AM EST (about 14:00 UTC), and on 2026-10-14 nothing was published by 18:00 UTC. So there are four passes a day:
# one that finds nothing newer than the saved state stops after one 90-byte request, which makes the extra ones nearly
# free. status.json records the pass that first built each new day (`lastNewBuild.runAt`): once a week or two of it
# shows when MTGJSON really publishes, keep only the passes that matter. `bootstrap` rebuilds everything from
# MTGJSON's 90-day file. About once a week the job also writes a REPORT (status.json `lastResync`) of what differs between
# the published set and MTGJSON's current 90-day file; it never changes what is published.
on:
  schedule:
    - cron: "15 8 * * *"
    - cron: "15 12 * * *"
    - cron: "15 15 * * *"
    - cron: "15 19 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Rebuild everything from MTGJSON's 90-day file instead of appending one day"
        type: boolean
        default: false
      resync:
        description: "Also run the resynchronisation REPORT now (report only: nothing published changes)"
        type: boolean
        default: false
      republish:
        description: "Publish the current set and the static files (site.json...) again, even if MTGJSON has nothing newer"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The shard files are carried from one day to the next in ONE release asset, replaced every day:
      # committing 4 096 changing files daily would grow the repository by the size of the data every time.
      - name: Fetch the previous state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/state
          if [ "${{ inputs.bootstrap }}" != "true" ] && gh release download state --pattern state.tar --dir work; then
            tar -xf work/state.tar -C work/state
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        id: build
        run: |
          FLAGS=""
          if [ "${{ inputs.resync }}" = "true" ]; then FLAGS="--resync"; fi
          if [ "${{ steps.state.outputs.have }}" = "true" ]; then
            node scripts/daily.mjs --state work/state --out work/out --work work/tmp --report work/report.json $FLAGS
          else
            node scripts/daily.mjs --bootstrap --out work/out --work work/tmp --report work/report.json $FLAGS
          fi

      # A new day is always published. `republish` also publishes the set as it stands (the saved state), which is how a
      # change to site-static/ (site.json, where the plugin looks for the files) goes live without waiting for MTGJSON.
      - name: What to publish
        id: publish
        run: |
          if [ "${{ steps.build.outputs.skipped }}" != "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "dir=work/out" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.republish }}" = "true" ] && [ "${{ steps.state.outputs.have }}" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "dir=work/state" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble the site
        if: steps.publish.outputs.go == 'true'
        run: |
          # What is published is the state without the vendors we do not publish (Mana Pool: collected, not published), checked again once written.
          node scripts/publish.mjs --from ${{ steps.publish.outputs.dir }} --out work/site-data
          mkdir site
          cp -r work/site-data/s site/s
          cp work/site-data/meta.json site/meta.json
          cp site-static/* site/

      # The market movers (the plugin's "Market trends" block): twelve small lists computed from the same state, written next to the prices
      # (scripts/lib/movers.mjs says what a list is). A step of its own whose failure is tolerated: without these files the plugin asks
      # another source for the movers, which is out of date but harmless, and a problem here must never hold back the day's prices.
      # The files are only copied to the site once the script has read them back and checked them.
      - name: Market movers
        id: movers
        if: steps.publish.outputs.go == 'true'
        continue-on-error: true
        run: |
          node scripts/movers.mjs --from ${{ steps.publish.outputs.dir }} --out work/movers --report work/movers-report.json
          cp -r work/movers/movers site/movers

      - uses: actions/configure-pages@v5
        if: steps.publish.outputs.go == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.publish.outputs.go == 'true'
        with:
          path: site

      - name: Deploy
        id: deployment
        if: steps.publish.outputs.go == 'true'
        uses: actions/deploy-pages@v4

      # After the deployment, not before: if it fails the state is not saved, so the next run does the same day again.
      - name: Save the state
        if: steps.build.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -cf work/state.tar -C work/out .
          gh release view state > /dev/null 2>&1 || gh release create state --title "state" --latest=false \
            --notes "Working state of the daily job: the shard files and what is needed to append the next day. Replaced every day, not meant to be downloaded."
          gh release upload state work/state.tar --clobber

      # One small commit a day: a public repository's scheduled workflows are switched off after 60 days without activity.
      - name: Record the day
        env:
          MOVERS_OUTCOME: ${{ steps.movers.outcome }}
        run: |
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("work/report.json", "utf8"));
            let s = {};
            try { s = JSON.parse(fs.readFileSync("status.json", "utf8")); } catch {}
            s = { ...s, asOf: r.asOf, mtgjson: r.mtgjson.version, checkedOn: new Date().toISOString().slice(0, 10) };
            if (r.counts) s = { ...s, cards: r.counts.cards, series: r.counts.series, liveRatio: r.liveRatio };
            if (!r.skipped) s.lastNewBuild = { asOf: r.asOf, metaLastModified: r.metaLastModified ?? null, runAt: r.seenAt };
            if (r.resync) s.lastResync = { ranAt: r.seenAt, ...r.resync };
            if (r.anomalies) {
              // The passive counter: the last 30 days, one line each (jumps/drops of the last day against the day before, see lib/anomalies.mjs).
              const a = r.anomalies;
              s.anomalyHistory = [...(s.anomalyHistory ?? []).filter((e) => e.asOf !== a.asOf), { asOf: a.asOf, jumps: a.jumps, drops: a.drops, byVendor: a.byVendor }].slice(-30);
            }
            // The market movers: what the step wrote, or that it failed (the files are then missing from the site, see the step).
            if (process.env.MOVERS_OUTCOME === "success") {
              const m = JSON.parse(fs.readFileSync("work/movers-report.json", "utf8"));
              s.lastMovers = { asOf: m.asOf, rows: m.rows, lastNewDays: m.lastNewDays };
            } else if (process.env.MOVERS_OUTCOME === "failure") {
              s.lastMovers = { ...(s.lastMovers ?? {}), failedAt: new Date().toISOString() };
            }
            fs.writeFileSync("status.json", JSON.stringify(s, null, 1) + "\n");
          '
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || { git commit -m "status: data as of $(node -p 'require("./status.json").asOf')" && git push; }

      # Last, so that a problem here can never hold back the day. One snapshot of the set a week, the last eight kept: the state is ONE
      # release asset replaced every day, and what is older than MTGJSON's 90-day window exists nowhere else (README, "Backups").
      - name: Weekly backup of the state
        if: steps.publish.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/backup.mjs --dir ${{ steps.publish.outputs.dir }} --work work/tmp
